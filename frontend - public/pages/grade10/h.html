        successFloat 1.2s ease-in-out 0.7s;

@keyframes successPop {

    0% {
        transform: scale(0.2) rotate(-8deg);
        opacity: 0;
    }

    60% {
        transform: scale(1.15) rotate(3deg);
        opacity: 1;
    }

    80% {
        transform: scale(0.95) rotate(-1deg);
    }

    100% {
        transform: scale(1) rotate(0);

}

@keyframes successFloat {

function shuffle(array) {

    let arr = [...array];

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [arr[i], arr[j]] =
            [arr[j], arr[i]];
    }

    return arr;
}


/* =====================================================
   RANDOM DATASET
   ===================================================== */

function generateRandomSortedDataset(
    count,
    min,
    max
) {

    let data = [];

    for (let i = 0; i < count; i++) {

        let val =
            Math.floor(
                Math.random() *
                (max - min + 1)
            ) + min;

        data.push(val);
    }

    return data.sort(
        (a, b) => a - b
    );
}


function toSubscript(number) {

function ordinalnumber(n) {

    const j = n % 10;
    const k = n % 100;

    if (
        j === 1 &&
        k !== 11
    ) {
        return n + "st";
    }

    if (
        j === 2 &&
        k !== 12
    ) {
        return n + "nd";
    }

    if (
        j === 3 &&
        k !== 13
    ) {
        return n + "rd";
    }

    return n + "th";
}


/* =====================================================
   POSITION
   ===================================================== */

function calculatePosition(
    type,
    item,
    n
) {

    if (type === "Q") {

        return (
            item / 4
        ) * (n + 1);

    }

    if (type === "D") {

        return (
            item / 10
        ) * (n + 1);

    }

    return (
        item / 100
    ) * (n + 1);

}


/* =====================================================
   ANSWER
   ===================================================== */

function calculateAnswer(
    data,
    type,
    item
) {

    const sortedData =
        [...data].sort(
            (a, b) => a - b
        );

    const position =
        calculatePosition(
            type,
            item,
            sortedData.length
        );


    if (position <= 1) {

        return sortedData[0];

    }


    if (
        position >=
        sortedData.length
    ) {

        return sortedData[
            sortedData.length - 1
        ];

    }


    const lowerIndex =
        Math.floor(position) - 1;

    const fraction =
        position -
        Math.floor(position);

    const lowerValue =
        sortedData[lowerIndex];

    const upperValue =
        sortedData[
            lowerIndex + 1
        ];


    return (
        lowerValue +
        fraction *
        (upperValue - lowerValue)
    );
}


/* =====================================================
   FORMAT ANSWER
   ===================================================== */

function formatAnswer(value) {

    if (
        Number.isInteger(value)
    ) {

        return String(value);

    }

    return value
        .toFixed(2)
        .replace(/\.00$/, "");
}


/* =====================================================
   MEASURE NAME
   ===================================================== */

function getMeasureName(
    type,
    item
) {

    if (type === "Q") {

        if (item === 1) {
            return "lower quartile";
        }

        if (item === 2) {
            return "median";
        }

        return "upper quartile";
    }


    if (type === "D") {

        return (
            `${ordinalnumber(item)} decile`
        );

    }


    return (
        `${ordinalnumber(item)} percentile`
    );
}


/* =====================================================
   QUESTION TEXT
   ===================================================== */

function createQuestionText(
    question
) {

    const measure =
        getMeasureName(
            question.type,
            question.item
        );

    const label =
        question.type +
        toSubscript(
            question.item
        );

    return (
        `What is the ${measure} (${label})?`
    );
}


/* =====================================================
   GENERATE ONE QUESTION
   ===================================================== */

function generateQuestion(template) {

    const studentCount =
        template.type === "Q"
            ? QUARTILE_DATASET_SIZE
            : DECILE_PERCENTILE_DATASET_SIZE;


    const data =
        generateRandomSortedDataset(
            studentCount,
            template.min,
            template.max
        );


    const position =
        calculatePosition(
            template.type,
            template.item,
            studentCount
        );


    const answer =
        calculateAnswer(
            data,
            template.type,
            template.item
        );


    return {

        category:
            template.category,

        context:
            template.context,

        data:
            data,

        type:
            template.type,

        item:
            template.item,

        studentCount:
            studentCount,

        position:
            position,

        answer:
            answer

    };
}


/* =====================================================
   GENERATE QUESTIONS
   ===================================================== */

function generateQuestions() {

    let generated = [];

    let usedQuestions =
        new Set();

    let attempts = 0;

    const maxAttempts = 5000;


    while (
        generated.length <
            TOTAL_QUESTIONS &&
        attempts <
            maxAttempts
    ) {

        attempts++;


        const template =
            questionTemplates[
                Math.floor(
                    Math.random() *
                    questionTemplates.length
                )
            ];


        const question =
            generateQuestion(
                template
            );


        const uniqueKey =
            [
                question.category,
                question.type,
                question.item,
                question.data.join(",")
            ].join("|");


        if (
            !usedQuestions.has(
                uniqueKey
            )
        ) {

            usedQuestions.add(
                uniqueKey
            );

            generated.push(
                question
            );
        }
    }


    return shuffle(
        generated
    );
}


/* =====================================================
   CORRECT ANSWER ANIMATION
   ===================================================== */

function showSuccessAnimation() {

    const messages = [
        "GOOD JOB!",
        "EXCELLENT!",
        "GREAT WORK!",
        "AWESOME!",
        "AMAZING!",
        "WELL DONE!",
        "KEEP IT UP!",
        "FANTASTIC!",
        "OUTSTANDING!",
        "YOU'RE DOING GREAT!",
        "BRILLIANT!",
        "SUPERB!",
        "IMPRESSIVE!",
        "NICE WORK!",
        "YOU GOT THIS!"
    ];

    let message;

    /*
       Piliin ang message base sa consecutive correct.
       Pag 4 pataas, random na para hindi puro PERFECT.
    */

    if (consecutiveCorrect === 1) {
        message = "GOOD JOB!";
    }

    else if (consecutiveCorrect === 2) {
        message = "EXCELLENT!";
    }

    else if (consecutiveCorrect === 3) {
        message = "GREAT WORK!";
    }

    else {
        /*
           4 pataas:
           Random message mula sa listahan.
        */

        message = 
            messages[
                Math.floor(
                    Math.random() * messages.length
                )
            ];

        /*
           Siguraduhin na hindi laging
           PERFECT ang lumalabas.
        */
        if (message === "PERFECT!") {
            message = "AWESOME!";
        }
    }

    successText.textContent = message;

    successAnimation.classList.remove("hidden");

    successText.style.animation = "none";

    void successText.offsetWidth;

    successText.style.animation =
        "successPop 0.7s ease-out, successFloat 1.2s ease-in-out 0.7s";

    setTimeout(
        function() {

            successAnimation.classList.add(
                "hidden"
            );

        },
        1900
    );
}

/* =====================================================
   8. COUNTDOWN
   ===================================================== */

function startCountdown() {

    let count = 3;

    countdownNumber.textContent =
        count;


    const countdown =
        setInterval(
            function() {

                count--;


                if (count > 0) {

                    countdownNumber.textContent =
                        count;

                }

                else {

                    clearInterval(
                        countdown
                    );

                    countdownScreen.classList.add(
                        "hidden"
                    );

                    quizScreen.classList.remove(
                        "hidden"
                    );

                    beginQuiz();
                }

            },
            1000
        );
}


/* =====================================================
   9. BEGIN QUIZ
   ===================================================== */

function beginQuiz() {

    questions =
        generateQuestions();


    currentQuestion = 0;

    score = 0;

    quizResults = [];

    consecutiveCorrect = 0;


    startTimer();

    showQuestion();
}


/* =====================================================
   10. TIMER
   ===================================================== */

function startTimer() {

    clearInterval(
        timerInterval
    );


    startTime =
        Date.now();

    elapsedSeconds = 0;


    timer.textContent =
        "Time: 00:00";


    timerInterval =
        setInterval(
            function() {

                elapsedSeconds =
                    Math.floor(
                        (
                            Date.now() -
                            startTime
                        ) / 1000
                    );


                timer.textContent =
                    "Time: " +
                    formatTime(
                        elapsedSeconds
                    );

            },
            1000
        );
}


function formatTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const remainingSeconds =
        seconds % 60;


    return (
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(
            remainingSeconds
        ).padStart(2, "0")
    );
}

/* =====================================================
   12. SUBMIT ANSWER
   ===================================================== */

submitButton.addEventListener(
    "click",
    submitAnswer
);


function submitAnswer() {

    const question =
        questions[
            currentQuestion
        ];


    if (
        positionInput.value.trim() ===
            "" ||
        answerInput.value.trim() ===
            ""
    ) {

        feedback.textContent =
            "Please enter both the position and the answer.";

        feedback.className =
            "wrong";

        feedback.classList.remove(
            "hidden"
        );

        return;
    }


    const enteredPosition =
        Number(
            positionInput.value
        );


    const userAnswer =
        Number(
            answerInput.value
        );


    const expectedPosition =
        Number(
            question.position.toFixed(2)
        );


    const expectedAnswer =
        Number(
            formatAnswer(
                question.answer
            )
        );


    const positionCorrect =
        Number.isFinite(
            enteredPosition
        ) &&
        Math.abs(
            enteredPosition -
            expectedPosition
        ) < 0.01;


    const answerCorrect =
        Number.isFinite(
            userAnswer
        ) &&
        Math.abs(
            userAnswer -
            expectedAnswer
        ) < 0.01;


    const isCorrect =
        positionCorrect &&
        answerCorrect;


    if (isCorrect) {

        score++;

        consecutiveCorrect++;

        showSuccessAnimation();

    }

    else {

        consecutiveCorrect = 0;

    }


    /*
       NO FRACTION.
       NO SOLUTION EXPLANATION.
       ONLY CORRECT POSITION AND CORRECT ANSWER.
    */

    feedback.innerHTML =

        `${isCorrect
            ? "✓ Correct!"
            : "✗ Check your answers."
        }<br><br>` +

        `Position:
        <strong>
            ${
                positionCorrect
                    ? "Correct"
                    : "Incorrect"
            }
        </strong>
        <br>
        Correct Position:
        <strong>
            ${formatAnswer(
                question.position
            )}
        </strong>
        <br><br>` +

        `Answer:
        <strong>
            ${
                answerCorrect
                    ? "Correct"
                    : "Incorrect"
            }
        </strong>
        <br>
        Correct Answer:
        <strong>
            ${formatAnswer(
                question.answer
            )}
        </strong>`;


    feedback.className =
        isCorrect
            ? "correct"
            : "wrong";


    feedback.classList.remove(
        "hidden"
    );


    quizResults.push({

        category:
            question.category,

        dataset:
            question.data.join(", "),

        question:
            createQuestionText(
                question
            ),

        measure:
            question.type +
            toSubscript(
                question.item
            ),

        positionAnswer:
            enteredPosition,

        correctPosition:
            formatAnswer(
                question.position
            ),

        studentAnswer:
            userAnswer,

        correctAnswer:
            formatAnswer(
                question.answer
            ),

        result:
            isCorrect
                ? "CORRECT"
                : "INCORRECT"

    });


    positionInput.disabled =
        true;

    answerInput.disabled =
        true;


    submitButton.disabled =
        true;

    submitButton.classList.add(
        "hidden"
    );


    if (
        currentQuestion ===
        TOTAL_QUESTIONS - 1
    ) {

        nextButton.textContent =
            "SHOW SUMMARY";

    }

    else {

        nextButton.textContent =
            "NEXT QUESTION";

    }


    nextButton.classList.remove(
        "hidden"
    );
}


/* =====================================================
   13. NEXT QUESTION / SHOW SUMMARY
   ===================================================== */

nextButton.addEventListener(
    "click",
    function() {

        if (
            currentQuestion ===
            TOTAL_QUESTIONS - 1
        ) {

            finishQuiz();

            return;
        }


        currentQuestion++;

        showQuestion();

    }
);


/* =====================================================
   14. ENTER KEY
   ===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !== "Enter"
        ) {
            return;
        }


        if (
            quizScreen.classList.contains(
                "hidden"
            )
        ) {
            return;
        }


        event.preventDefault();


        if (
            submitButton.disabled
        ) {

            nextButton.click();

        }

        else {

            submitAnswer();

        }

    }
);


/* =====================================================
   15. FINISH QUIZ
   ===================================================== */

function finishQuiz() {
    clearInterval(timerInterval);

    const percentage = Math.round((score / TOTAL_QUESTIONS) * 100);
    const quizType = "QUARTILES, DECILES, PERCENTILES";

    // SAVE RESULT TO GOOGLE SHEETS
    const formData = new URLSearchParams();

    formData.append("quizType", quizType);
    formData.append("studentName", studentName);
    formData.append("section", studentSection);
    formData.append("score", score);
    formData.append("totalQuiz", TOTAL_QUESTIONS);
    formData.append("percentage", percentage + "%");
    formData.append("time", formatTime(elapsedSeconds));

    fetch("https://script.google.com/macros/s/AKfycbzrMeuIcPYOPPifmbcYofRp70xKMS4DszabX3tsIcCAO3fFa9ggsHpHubj2b5uWfpU/exec", {
        method: "POST",
        mode: "no-cors",
        body: formData
    })
    .then(() => {
        console.log("Quiz result sent to Google Sheets.");
    })
    .catch((error) => {
        console.error("Could not send quiz result:", error);
    });

    // SHOW RESULT SCREEN
    quizScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");

    studentSummary.textContent =
        `Name: ${studentName} | Section: ${studentSection}`;

    finalScore.textContent =
        `Score: ${score} / ${TOTAL_QUESTIONS}`;

    finalTime.textContent =
        `Time: ${formatTime(elapsedSeconds)}`;

    finalCategory.textContent =
        `${TOTAL_QUESTIONS} Questions Completed`;
}
