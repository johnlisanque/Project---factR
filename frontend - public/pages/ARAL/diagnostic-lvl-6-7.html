@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;900&display=swap');

:root {
  --primary-dark: #073827;
  --primary-forest: #16623d;
  --primary-accent: #339763;
  --tint-light: #e7f7ee;
  --card-bg: #f7faf8;

  --text-main: #073827;
  --text-body: #2d473b;
  --text-muted: #567e6c;
  --border-color: #d8eade;
  --white: #ffffff;

  --font-brand: 'Montserrat', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Makes the "hidden" attribute win over any display rule below */
[hidden] {
  display: none !important;
}

html, body {
  width: 100%;
  min-height: 100vh;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background-color: var(--white);
  font-family: var(--font-body);
  color: var(--text-body);
  scroll-behavior: smooth;
}

/* ---------- Navigation ---------- */

.top-nav-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  width: 100%;
  background-color: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-color);
  padding: 14px 32px;
  animation: slideDownNav 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes slideDownNav {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.nav-container {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-logo {
  font-family: var(--font-brand);
  font-size: 1.25rem;
  font-weight: 900;
  letter-spacing: 0.04em;
  color: var(--primary-forest);
  text-decoration: none;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.nav-logo:hover { transform: scale(1.03); }

.nav-tagline {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  border-left: 1.5px solid var(--border-color);
  padding-left: 12px;
  display: none;
}

@media (min-width: 768px) {
  .nav-tagline { display: inline-block; }
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 7px;
  list-style: none;
}

.nav-link {
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--text-body);
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 7px;
  position: relative;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.nav-link::after {
  content: '';
  position: absolute;
  bottom: 4px;
  left: 10px;
  right: 10px;
  height: 2px;
  background-color: var(--primary-accent);
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 2px;
}

.nav-link:hover {
  color: var(--primary-forest);
  background-color: var(--tint-light);
  transform: translateY(-2px);
}

.nav-link:hover::after {
  transform: scaleX(1);
  transform-origin: left;
}

.nav-link.active {
  color: white;
  background-color: var(--primary-forest);
  box-shadow: 0 4px 14px rgba(22, 98, 61, 0.25);
}

	<script>
		const totalQuestions = 20;
	// Finds a page element by its ID.
	const element = (id) => document.getElementById(id);
	let questionNumber = 0;
	let correctAnswer;
	let answerType;

	// Returns a random integer within the given range.
	function random(min, max) {
		return Math.floor(Math.random() * (max - min + 1)) + min;
	}

	// Formats a numerator and denominator as a stacked fraction.
	function displayFraction(numerator, denominator) {
		return `<span class="fraction"><span>${numerator}</span><span>${denominator}</span></span>`;
	}

	// Reduces a fraction to its simplest form.
	function fraction(numerator, denominator) {
		if (denominator < 0) [numerator, denominator] = [-numerator, -denominator];
		let divisor = Math.abs(numerator);
		let remainder = denominator;
		while (remainder) [divisor, remainder] = [remainder, divisor % remainder];
		divisor ||= 1;
		return { numerator: numerator / divisor, denominator: denominator / divisor };
	}

	// Generates a Level 6 integer operation question.
	function integerQuestion() {
		const operation = ["+", "-", "×", "÷"][questionNumber % 4];
		let first = random(-10, 10);
		let second = random(-10, 10);

		if (operation === "÷") {
			while (!second) second = random(-10, 10);
			first = second * random(-10, 10);
			correctAnswer = first / second;
			answerType = "number";
			return `${displayFraction(first, second)} = ?`;
		} else {
			correctAnswer = operation === "+" ? first + second
				: operation === "-" ? first - second : first * second;
		}

		answerType = "number";
		return `${first} ${operation} ${second} = ?`;
	}

	// Generates a Level 7 fraction operation question.
	function fractionQuestion() {
		const operation = ["+", "-", "×", "÷", "+", "-"][questionNumber - 8];
		const first = fraction(random(1, 9), random(2, 10));
		const second = fraction(random(1, 9), random(2, 10));
		let numerator;
		let denominator;

		if (operation === "+" || operation === "-") {
			const sign = operation === "+" ? 1 : -1;
			numerator = first.numerator * second.denominator + sign * second.numerator * first.denominator;
			denominator = first.denominator * second.denominator;
		} else if (operation === "×") {
			numerator = first.numerator * second.numerator;
			denominator = first.denominator * second.denominator;
		} else {
			numerator = first.numerator * second.denominator;
			denominator = first.denominator * second.numerator;
		}

		correctAnswer = fraction(numerator, denominator);
		answerType = "fraction";
		const show = (value) => displayFraction(value.numerator, value.denominator);
		return `${show(first)} ${operation} ${show(second)} = ?`;
	}

	// Generates a Level 7 algebra operation question.
	function algebraQuestion() {
		const type = questionNumber - 14;
		const variable = ["x", "y", "z", "a", "b", "c"][type];
		let first;
		let second;
		let coefficient;
		let expression;
		let square = false;

		if (type < 2) {
			first = random(2, 9);
			second = random(2, 9);
			coefficient = first + second;
			expression = `${first}${variable} + ${second}${variable}`;
		} else if (type < 4) {
			first = random(5, 12);
			second = random(1, 4);
			coefficient = first - second;
			expression = `${first}${variable} - ${second}${variable}`;
		} else if (type === 4) {
			first = random(2, 6);
			second = random(2, 6);
			coefficient = first * second;
			square = true;
			expression = `${first}${variable} × ${second}${variable}`;
		} else {
			second = random(2, 6);
			first = random(2, 6) * second;
			coefficient = first / second;
			expression = displayFraction(`${first}${variable}²`, `${second}${variable}`);
		}

		correctAnswer = `${coefficient}${variable}${square ? "^2" : ""}`;
		answerType = "algebra";
		return `${expression} = ?`;
	}

	// Resets the answer fields and displays the current question.
	function generateQuestion() {
		element("answer").value = "";
		element("numerator").value = "";
		element("denominator").value = "";
		element("result").innerText = "";
		element("next").disabled = true;
		element("next").style.display = "none";

		if (questionNumber === totalQuestions) {
			element("level").innerText = "Completed";
			element("progress").innerText = "You finished all 20 questions!";
			element("question").innerText = "Well done!";
			["single-answer", "fraction-answer", "submit", "next"].forEach((id) => element(id).style.display = "none");
			return;
		}

		element("progress").innerText = `Question ${questionNumber + 1} of ${totalQuestions}`;
		if (questionNumber < 8) {
			element("level").innerText = "Level 6 - Integer Operations";
			element("question").innerHTML = integerQuestion();
		} else if (questionNumber < 14) {
			element("level").innerText = "Level 7 - Fraction Operations";
			element("question").innerHTML = fractionQuestion();
		} else {
			element("level").innerText = "Level 7 - Basic Algebraic Operations";
			element("question").innerHTML = algebraQuestion();
		}

		const isFraction = answerType === "fraction";
		element("single-answer").style.display = isFraction ? "none" : "block";
		element("fraction-answer").style.display = isFraction ? "flex" : "none";
	}

	// Parses and reduces a typed fraction or decimal answer.
	function parseFraction(value) {
		const parts = value.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
		if (parts) return Number(parts[2]) ? fraction(Number(parts[1]), Number(parts[2])) : null;
		if (!/^-?(?:\d+\.?\d*|\.\d+)$/.test(value)) return null;
		const denominator = 10 ** ((value.split(".")[1] || "").length);
		return fraction(Math.round(Number(value) * denominator), denominator);
	}

	// Checks the answer and displays feedback.
	function checkAnswer() {
		let correct;
		if (answerType === "number") {
			const value = element("answer").value.trim();
			if (!value) {
				element("result").innerText = "Please enter your answer.";
				return;
			}
			correct = Number(value) === correctAnswer;
		} else if (answerType === "fraction") {
			const numerator = element("numerator").value.trim();
			const denominator = element("denominator").value.trim();
			if (!numerator || !denominator) {
				element("result").innerText = "Please enter both the numerator and denominator.";
				return;
			}
			const given = parseFraction(`${numerator}/${denominator}`);
			if (!given) {
				element("result").innerText = "Enter a valid fraction with a nonzero denominator.";
				return;
			}
			correct = given && given.numerator === correctAnswer.numerator && given.denominator === correctAnswer.denominator;
		} else {
			const value = element("answer").value.trim();
			if (!value) {
				element("result").innerText = "Please enter your answer.";
				return;
			}
			correct = value.toLowerCase().replace(/\s+/g, "").replace(/\*/g, "×").replace(/²/g, "^2") === correctAnswer.toLowerCase();
		}

		const expected = answerType === "fraction"
			? `${correctAnswer.numerator}/${correctAnswer.denominator}`
			: String(correctAnswer).replace(/\^2/g, "²");
		element("result").innerText = correct ? "Correct!" : `Incorrect! The correct answer is ${expected}.`;
		element("next").disabled = false;
		element("next").style.display = "inline-block";
	}

	// Advances only when the required answer fields are filled.
	function nextQuestion() {
		if (answerType === "fraction") {
			if (!element("numerator").value.trim() || !element("denominator").value.trim()) return;
		} else if (!element("answer").value.trim()) {
			return;
		}

		if (questionNumber < totalQuestions) {
			questionNumber++;
			generateQuestion();
		}
	}

	element("submit").addEventListener("click", checkAnswer);
	element("next").addEventListener("click", nextQuestion);
	element("answer").addEventListener("keydown", (event) => {
		if (event.key === "Enter") checkAnswer();
	});
	element("numerator").addEventListener("keydown", (event) => {
		if (event.key === "Enter") checkAnswer();
	});
	element("denominator").addEventListener("keydown", (event) => {
		if (event.key === "Enter") checkAnswer();
	});
	generateQuestion();
	</script>
	<script>
		// Sets up student login, scoring, and record actions.
		(() => {
			// Finds a page element by its ID.
			const byId = (id) => document.getElementById(id);
			const login = byId("student-login");
			const form = byId("student-form");
			const quiz = byId("quiz-panel");
			const recordPanel = byId("record-panel");
			const question = byId("question");
			const result = byId("result");
			const level = byId("level");
			const total = Number(quiz.dataset.total || 20);
			const answers = new Map();
			let student;
			let saved = false;

			// Updates the score shown in the record panel.
			function updateScore() {
				const score = [...answers.values()].filter(Boolean).length;
				const text = `Score: ${score} / ${total}`;
				if (byId("record-score").textContent !== text) byId("record-score").textContent = text;
			}

			// Records whether the current answer was correct.
			function captureAnswer() {
				const response = result.textContent.trim();
				if (response === "Correct!" || response.startsWith("Incorrect!")) {
					const progress = byId("progress")?.textContent || "";
					answers.set(`${progress}|${question.textContent}`, response === "Correct!");
					updateScore();
				}
			}

			// Shows the record panel when the quiz ends.
			function checkCompletion() {
				const finished = /finished|completed/i.test(level.textContent) ||
					/finished all \d+ questions/i.test(question.textContent);
				if (finished && recordPanel.hidden) {
					recordPanel.hidden = false;
					updateScore();
				}
			}

			// Opens the quiz for the signed-in student.
			function startQuiz(details) {
				student = details;
				login.hidden = true;
				quiz.hidden = false;
				byId("student-summary").textContent =
					`${student.name} | Grade ${student.grade} | Section ${student.section}`;
			}

			// Splits and normalizes the grade and section input.
			function parseGradeSection(value) {
				const match = value.trim().match(/^(\d+)\s*[-–—]\s*(.+)$/);
				if (!match) return null;
				const grade = match[1];
				const section = match[2].trim().replace(/\s+/g, " ");
				return section ? { grade, section, gradeSection: `${grade} - ${section}` } : null;
			}

			// Validates and stores the student's login details.
			form.addEventListener("submit", (event) => {
				event.preventDefault();
				const name = byId("student-name").value.trim();
				const gradeSection = parseGradeSection(byId("student-grade-section").value);
				if (!name || !gradeSection) {
					byId("login-error").textContent = "Enter grade and section like 12 - Turing.";
					return;
				}
				byId("login-error").textContent = "";
				const details = { name, ...gradeSection };
				try {
					sessionStorage.setItem("aralMathStudent", JSON.stringify(details));
				} catch {
					// Keep the quiz usable when browser storage is unavailable.
				}
				startQuiz(details);
			});

			let savedStudent;
			try {
				savedStudent = JSON.parse(sessionStorage.getItem("aralMathStudent"));
			} catch {
				savedStudent = null;
			}
			const savedGradeSection = parseGradeSection(savedStudent?.gradeSection || "");
			if (savedStudent?.name && savedGradeSection) {
				startQuiz({ ...savedStudent, ...savedGradeSection });
			} else {
				login.hidden = false;
				quiz.hidden = true;
			}

			byId("submit").addEventListener("click", () => setTimeout(captureAnswer, 0));
			// Downloads a text record and stores a browser copy.
			byId("save-record").addEventListener("click", () => {
				if (!student || saved) return;
				const record = {
					...student,
					quiz: quiz.dataset.quiz,
					score: [...answers.values()].filter(Boolean).length,
					total,
					completedAt: new Date().toISOString()
				};

				const text = [
					"ARAL Math Quiz Record",
					`Student: ${record.name}`,
					`Grade: ${record.grade}`,
					`Section: ${record.section}`,
					`Quiz: ${record.quiz}`,
					`Score: ${record.score}/${record.total}`,
					`Saved: ${new Date(record.completedAt).toLocaleString()}`
				].join("\r\n");
				const file = new Blob([text], { type: "text/plain;charset=utf-8" });
				const link = document.createElement("a");
				const fileName = `${record.name}-${record.quiz}`.replace(/[^a-z0-9_-]+/gi, "_");
				const fileUrl = URL.createObjectURL(file);
				link.href = fileUrl;
				link.download = `${fileName}.txt`;
				document.body.appendChild(link);
				link.click();
				link.remove();
				URL.revokeObjectURL(fileUrl);

				try {
					const records = JSON.parse(localStorage.getItem("aralMathRecords") || "[]");
					records.push(record);
					localStorage.setItem("aralMathRecords", JSON.stringify(records));
					byId("record-status").textContent =
						`Downloaded ${link.download} and saved ${record.score}/${record.total}.`;
				} catch {
					byId("record-status").textContent = `Downloaded ${link.download}; browser storage was unavailable.`;
				}
				saved = true;
				byId("save-record").disabled = true;
			});

			// Reloads the quiz while keeping the student session.
			byId("restart-quiz").addEventListener("click", () => window.location.reload());
			new MutationObserver(captureAnswer).observe(result, { subtree: true, childList: true, characterData: true });
			const completionObserver = new MutationObserver(checkCompletion);
			[question, level].forEach((target) => completionObserver.observe(target, { childList: true, characterData: true }));
			checkCompletion();
		})();
	</script>
