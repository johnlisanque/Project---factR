@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;900&display=swap');

:root {
  --primary-dark: #073827;
  --primary-forest: #16623d;
  --primary-accent: #339763;
  --tint-light: #e7f7ee;
  --card-bg: #f7faf8;

  --text-main: #073827;
  --text-body: #2d473b;
  --text-muted: #567e6c;
  --border-color: #d8eade;
  --white: #ffffff;

  --font-brand: 'Montserrat', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Makes the "hidden" attribute win over any display rule below */
[hidden] {
  display: none !important;
}

html, body {
  width: 100%;
  min-height: 100vh;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background-color: var(--white);
  font-family: var(--font-body);
  color: var(--text-body);
  scroll-behavior: smooth;
}

/* ---------- Navigation ---------- */



@keyframes slideDownNav {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}



/* ---------- Cover ---------- */

.cover-section {
  width: 100vw;
  max-width: 100%;
  margin: 0;
  padding: 0;
  background: linear-gradient(180deg, #f7faf8 0%, #ffffff 100%);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: center;
  align-items: center;
  box-sizing: border-box;
  overflow: hidden;
}

.cover-wrapper {
  width: 100%;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  line-height: 0;
}

.cover-image {
  display: block;
  width: 100%;
  height: auto;
  max-height: 60vh;
  object-fit: cover;
  margin: 0;
  padding: 0;
  border-radius: 0;
  opacity: 0;
  transform: translateY(25px) scale(0.99);
  animation: entranceCover 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards,
             subtleFloat 6s ease-in-out 1.4s infinite alternate;
}

@keyframes entranceCover {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes subtleFloat {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-6px); }
}

/* ---------- Footer ---------- */

.site-footer {
  width: 100%;
  background-color: var(--card-bg);
  border-top: 1px solid var(--border-color);
  padding: 24px 32px;
  margin: 0;
}

.footer-bottom {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.8125rem;
  color: var(--text-muted);
}

/* ---------- Quiz page layout ---------- */

.level-main {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 48px 24px 72px;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.level-intro {
  text-align: center;
}

.level-intro h1 {
  font-family: var(--font-brand);
  font-size: clamp(2rem, 5vw, 2.75rem);
  font-weight: 900;
  letter-spacing: 0.02em;
  line-height: 1.1;
  color: var(--primary-dark);
  margin-bottom: 12px;
}

.level-intro p {
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--text-muted);
}

/* Shared card look for login and quiz */

.student-gate,
.quiz-panel {
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 10px 30px rgba(7, 56, 39, 0.06);
  animation: riseIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes riseIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.student-gate h2,
.quiz-topline h2,
.record-panel h2 {
  font-family: var(--font-brand);
  font-size: 1.375rem;
  font-weight: 700;
  color: var(--primary-forest);
}

/* ---------- Login form ---------- */

.student-form {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-top: 20px;
}

.student-form label,
.answer-field label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text-main);
}

input[type="text"],
select {
  width: 100%;
  font-family: var(--font-body);
  font-size: 1rem;
  color: var(--text-main);
  background-color: var(--white);
  border: 1.5px solid var(--border-color);
  border-radius: 10px;
  padding: 12px 14px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input[type="text"]::placeholder {
  color: var(--text-muted);
  opacity: 0.7;
}

input[type="text"]:focus,
select:focus {
  outline: none;
  border-color: var(--primary-accent);
  box-shadow: 0 0 0 4px rgba(51, 151, 99, 0.18);
}

/* ---------- Buttons ---------- */

button {
  font-family: var(--font-body);
  font-size: 0.9375rem;
  font-weight: 700;
  color: var(--white);
  background-color: var(--primary-forest);
  border: 1.5px solid var(--primary-forest);
  border-radius: 10px;
  padding: 12px 22px;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}


button:focus-visible {
  outline: 3px solid var(--primary-accent);
  outline-offset: 2px;
}

button.secondary {
  color: var(--primary-forest);
  background-color: var(--white);
  border-color: var(--border-color);
}

button.secondary:hover:not(:disabled) {
  background-color: var(--tint-light);
  border-color: var(--primary-accent);
  box-shadow: none;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.student-form button[type="submit"] {
  align-self: flex-start;
  margin-top: 4px;
}

/* ---------- Quiz panel ---------- */

.quiz-topline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  padding-bottom: 16px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border-color);
}

.student-summary {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-muted);
  background-color: var(--tint-light);
  border-radius: 999px;
  padding: 6px 14px;
}

.student-summary:empty { display: none; }

.quiz-question {
  font-family: var(--font-brand);
  font-size: clamp(1.375rem, 4vw, 1.875rem);
  font-weight: 700;
  line-height: 1.3;
  color: var(--text-main);
  margin-bottom: 24px;
  min-height: 2.6em;
}

.answer-field {
  margin-bottom: 20px;
}

.answer-field input {
  font-size: 1.25rem;
  font-weight: 600;
  padding: 14px 16px;
}

.quiz-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.quiz-feedback {
  min-height: 1.6em;
  margin-top: 20px;
  font-size: 1.0625rem;
  font-weight: 700;
  line-height: 1.5;
  color: var(--primary-forest);
}

/* ---------- Record panel ---------- */

.record-panel {
  margin-top: 28px;
  padding: 24px;
  background-color: var(--white);
  border: 1.5px solid var(--primary-accent);
  border-radius: 14px;
  animation: riseIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}

#record-score {
  font-family: var(--font-brand);
  font-size: 2rem;
  font-weight: 900;
  color: var(--primary-dark);
  margin: 12px 0 20px;
}

.record-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.record-summary {
  margin-top: 16px;
  font-size: 0.9375rem;
  color: var(--text-muted);
}

.record-summary:empty { display: none; }

/* ---------- Responsive ---------- */

@media (max-width: 768px) {
  .top-nav-bar { padding: 10px 16px; }

  .nav-container > .hamburger-btn {
    margin-left: auto;
    flex-shrink: 0;
  }

  .nav-links { gap: 6px; }

  .nav-link {
    font-size: 0.75rem;
    padding: 6px 10px;
  }

  .site-footer { padding: 20px 16px; }

  .footer-bottom {
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
  }

  .level-main { padding: 32px 16px 56px; gap: 24px; }

  .student-gate,
  .quiz-panel { padding: 22px 18px; }

  .quiz-actions button,
  .record-actions button,
  .student-form button[type="submit"] {
    flex: 1 1 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

        /**
         * Converts a numeric value into its corresponding English number word.
         *
         * The function handles numbers from 1 to 999 by using the
         * ones, teens, and tens word lists. For numbers greater than
         * 99, the function recursively converts the remaining value.
         *
         * Examples:
         *  - 5   -> five
         *  - 15  ->"fifteen"
         *  - 42  ->"forty-two"
         *  - 100 ->"one hundred"
         *  - 125 ->"one hundred twenty-five"
         *
         * @author Lisanque
         *
         * @param {number} number the numeric value to convert into a word
         * @returns {string} the English word representation of the number
         */
        function numberToWord(number) { // use this function if needs

            if (number < 10) {
                return ones[number];
            }

            if (number < 20) {
                return teens[number - 10];
            }

            if (number < 100) {
                const ten = Math.floor(number / 10);
                const one = number % 10;

                return one === 0
                    ? tens[ten]
                    : `${tens[ten]}-${ones[one]}`;
            }

            const hundred = Math.floor(number / 100);
            const remainder = number % 100;

            if (remainder === 0) {
                return `${ones[hundred]} hundred`;
            }

            return `${ones[hundred]} hundred ${numberToWord(remainder)}`;
        }

                else if (operation == 1) {

                    if (number1 < number2) {

        function checkAnswer() {

            document.getElementById("next").style.display = "inline-block";
        }

        function nextQuestion() {

            if (!document.getElementById("answer").value.trim()) return;

            if (questionNumber < 20) {

                questionNumber++;

                generateQuestion();

            } else {

                questionNumber++;

                generateQuestion();
            }
        }

        document.getElementById("submit")
            .addEventListener("click", checkAnswer);

        generateQuestion();

    <script>
        // Sets up student login, scoring, and record actions.
        (() => {
          // Finds a page element by its ID.
            const byId = (id) => document.getElementById(id);
            const login = byId("student-login");
            const form = byId("student-form");
            const quiz = byId("quiz-panel");
            const recordPanel = byId("record-panel");
            const question = document.querySelector("#question, #questions");
            const result = byId("result");
            const level = byId("level");
            const total = Number(quiz.dataset.total || 20);
            const answers = new Map();
            let student;
            let saved = false;

            // Updates the score shown in the record panel.
            function updateScore() {
                const score = [...answers.values()].filter(Boolean).length;
                const text = `Score: ${score} / ${total}`;
                if (byId("record-score").textContent !== text) byId("record-score").textContent = text;
            }

            // Records whether the current answer was correct.
            function captureAnswer() {
                const response = result.textContent.trim();
                if (response === "Correct!" || response.startsWith("Incorrect!")) {
                    const progress = byId("progress")?.textContent || "";
                    answers.set(`${progress}|${question.textContent}`, response === "Correct!");
                    updateScore();
                }
            }

            // Shows the record panel when the quiz ends.
            function checkCompletion() {
                const finished = /finished|completed/i.test(level.textContent) ||
                    /finished all \d+ questions/i.test(question.textContent);
                if (finished && recordPanel.hidden) {
                    recordPanel.hidden = false;
                    updateScore();
                }
            }

            // Opens the quiz for the signed-in student.
            function startQuiz(details) {
                student = details;
                login.hidden = true;
                quiz.hidden = false;
                byId("student-summary").textContent =
                    `${student.name} | Grade ${student.grade} | Section ${student.section}`;
            }

            // Splits and normalizes the grade and section input.
            function parseGradeSection(value) {
                const match = value.trim().match(/^(\d+)\s*[-–—]\s*(.+)$/);
                if (!match) return null;
                const grade = match[1];
                const section = match[2].trim().replace(/\s+/g, " ");
                return section ? { grade, section, gradeSection: `${grade} - ${section}` } : null;
            }

            // Validates and stores the student's login details.
            form.addEventListener("submit", (event) => {
                event.preventDefault();
                const name = byId("student-name").value.trim();
                const gradeSection = parseGradeSection(byId("student-grade-section").value);
                if (!name || !gradeSection) {
                    byId("login-error").textContent = "Enter grade and section like 12 - Turing.";
                    return;
                }
                byId("login-error").textContent = "";
                const details = { name, ...gradeSection };
                try {
                    sessionStorage.setItem("aralMathStudent", JSON.stringify(details));
                } catch {
                    // Keep the quiz usable when browser storage is unavailable.
                }
                startQuiz(details);
            });

            let savedStudent;
            try {
                savedStudent = JSON.parse(sessionStorage.getItem("aralMathStudent"));
            } catch {
                savedStudent = null;
            }
            const savedGradeSection = parseGradeSection(savedStudent?.gradeSection || "");
            if (savedStudent?.name && savedGradeSection) {
                startQuiz({ ...savedStudent, ...savedGradeSection });
            } else {
                login.hidden = false;
                quiz.hidden = true;
            }

            byId("submit").addEventListener("click", () => setTimeout(captureAnswer, 0));
            // Downloads a text record and stores a browser copy.
            byId("save-record").addEventListener("click", () => {
                if (!student || saved) return;
                const record = {
                    ...student,
                    quiz: quiz.dataset.quiz,
                    score: [...answers.values()].filter(Boolean).length,
                    total,
                    completedAt: new Date().toISOString()
                };

                  const text = [
                    "ARAL Math Quiz Record",
                    `Student: ${record.name}`,
                    `Grade: ${record.grade}`,
                    `Section: ${record.section}`,
                    `Quiz: ${record.quiz}`,
                    `Score: ${record.score}/${record.total}`,
                    `Saved: ${new Date(record.completedAt).toLocaleString()}`
                  ].join("\r\n");
                  const file = new Blob([text], { type: "text/plain;charset=utf-8" });
                  const link = document.createElement("a");
                  const fileName = `${record.name}-${record.quiz}`.replace(/[^a-z0-9_-]+/gi, "_");
                  const fileUrl = URL.createObjectURL(file);
                  link.href = fileUrl;
                  link.download = `${fileName}.txt`;
                  document.body.appendChild(link);
                  link.click();
                  link.remove();
                  URL.revokeObjectURL(fileUrl);

                try {
                    const records = JSON.parse(localStorage.getItem("aralMathRecords") || "[]");
                    records.push(record);
                    localStorage.setItem("aralMathRecords", JSON.stringify(records));
                    byId("record-status").textContent =
                      `Downloaded ${link.download} and saved ${record.score}/${record.total}.`;
                } catch {
                    byId("record-status").textContent = `Downloaded ${link.download}; browser storage was unavailable.`;
                }
                  saved = true;
                  byId("save-record").disabled = true;
            });

            // Reloads the quiz while keeping the student session.
            byId("restart-quiz").addEventListener("click", () => window.location.reload());
            new MutationObserver(captureAnswer).observe(result, { subtree: true, childList: true, characterData: true });
            const completionObserver = new MutationObserver(checkCompletion);
            [question, level].forEach((target) => completionObserver.observe(target, { childList: true, characterData: true }));
            checkCompletion();
        })();
    </script>
