    padding: 15px;
    background-color: antiquewhite;

.section{

#piecewise-card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 40px;
}
#answer-container {
    display: grid;
    /* place-items: center; */
    gap: 10px;
}
#answer{
     display: grid;
    /* place-items: center; */
    gap: 10px;

#student-information.section {
    
    min-height: 100vh;

    position: absolute;
    top: 0;
    left: 0;
    
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #ffffff;
    padding: 2rem;

    /* background-color: transparent; */
    
.container {
    width: 100%;
    max-width: 500px;

    display: flex;
    flex-direction: column;
    gap: 20px;

    padding: 35px;

    background: navajowhite;
    border: 1px solid #e5e5e7;
    border-radius: 18px;

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
}

.container h1 {
    font-size: 28px;
    font-weight: 700;
    color: #1d1d1f;
    margin-bottom: 5px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-group label {
    font-size: 14px;
    font-weight: 600;
    color: #3a3a3c;
}

.form-group input,
.form-group select {
    width: 100%;
    height: 48px;

    padding: 0 14px;

    font-size: 16px;
    color: #1d1d1f;

    background: #ffffff;
    border: 1px solid #c7c7cc;
    border-radius: 10px;

    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.form-group input::placeholder {
    color: #8e8e93;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #54141d;
    box-shadow: 0 0 0 3px rgba(84, 20, 29, 0.12);
}

#continue {
    width: 100%;
    height: 48px;

    margin-top: 5px;

    border: none;
    border-radius: 0.2em;

    background: #54141d;
    color: #ffffff;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;

    transition: background 0.2s, transform 0.1s;
}

#create-section:hover {
    background: #6b1a25;
}

#create-section:active {
    transform: scale(0.98);
}
}


@media (max-width: 600px) {
    .section {
        padding: 1rem;
    }

    .container {
        padding: 25px;
    }

    .container h1 {
        font-size: 24px;
    }
}
</style>

<section class="section" id="piecewise-information">
    <div class="card" id="piecewise-card">
        <div id="stats"></div>
        <h1>Compute and Answer</h1>

        <div id="display-text"></div>

        <div class="container" id="answer-input-container">
            <label for="answer-input">Answer</label>

            <input
                type="number"
                id="answer-input"
            >

            <button id="submit-answer">
                Submit
            </button>
        </div>

        <div class="container" id="answer-container">
            <h2>Answer</h2>
            <span id="answer"></span>
        </div>

    </div>
</section>
<section class="section"  id="student-information">
    <div class="container">

        <h1>Student Information</h1>

        <div class="form-group">
            <label for="student-name">Student Name</label>
            <input
                type="text"
                id="student-name"
                name="studentName"
                placeholder="Enter student name"
            >
        </div>

        <div class="form-group">
            <label for="section-name">Section Name</label>
            <input
                type="text"
                id="section-name"
                name="sectionName"
                placeholder="Enter section name"
            >
        </div>

        <div class="form-group">
            <label for="grade-level">Grade Level</label>
            <select id="grade-level" name="gradeLevel">
                <option value="" disabled selected>
                    Select grade level
                </option>
                <option value="11">Grade 11</option>
                <option value="12">Grade 12</option>
            </select>
        </div>

        <button type="button" id="continue">
            continue
        </button>

    </div>
</section>

function constraint(c1, c2){
            // check if c1 and c2 have valid value
            if((c1.length === 0 || c1 === null) ||  (c2.length === 0 || c2 === null)){
                return 0;
            }
            if(c1 > c2){
                return 0;
            }
 
            return Math.floor(Math.random() * (Math.floor(c2)-Math.ceil(c1)+1) )+ Math.ceil(c1)
        }



        class Transportation {
    constructor(baseDistance, baseFare, targetDistance, additionalFarePerKm, vehicle) {
        this.baseDistance = baseDistance;

        this.targetDistance = targetDistance;
        this.additionalFarePerKm = additionalFarePerKm;
        this.vehicle = vehicle;
    }
