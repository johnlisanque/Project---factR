        const $questionTextDisplay = document.getElementById("display-text")

        let currSession;

function geometric() {
    const _a1 = constraint(2, 20);
    const _r = constraint(2, 5);
    const _operator = randOp("geometric: sequence");
    const _len = 4;

    const sequence = [];

    for (let i = 0; i < _len; i++) {
        if (_operator === "×") {
            sequence.push(
                simplifyFraction(
                    _a1 * (_r ** i),
                    1
                )
            );
        } else {
            sequence.push(
                simplifyFraction(
                    _a1,
                    _r ** i
                )
            );
        }
    }

    let ans;

    if (_operator === "×") {
        ans = simplifyFraction(
            _a1 * (_r ** _len),
            1
        );
    } else {
        ans = simplifyFraction(
            _a1,
            _r ** _len
        );
    }

    return {
        sequence,
        ans
    };
}
        // returns a random
        function constraint(c1, c2){
            // check if c1 and c2 have valid value
            if((c1.length === 0 || c1 === null) ||  (c2.length === 0 || c2 === null)){
                return 0;
            }
            if(c1 > c2){
                return 0;
            }
 
            return Math.floor(Math.random() * (Math.floor(c2)-Math.ceil(c1)+1) )+ Math.ceil(c1)
        }
        function generateSequence(startingNum, length, scalar, operator){
            const sequence= []
            let currNum = startingNum
            for(let i = 0; i < length; i++){
                sequence.push(currNum)
                currNum = toValidJsMathOperator(operator)(currNum, scalar)
            }
            return sequence
        }
        function toValidJsMathOperator(operator){
            return {
              '+': (a, b) => a + b,
              '-': (a, b) => a - b,
              '×': (a, b) => a * b,
              '÷': (a, b) => a / b
            }[operator];
        }
        // return random operation base on math type
        function randOp(t){
            switch(t){
                case "arithmetic: sequence":{
                
                    const index = constraint(0,1)
                    const validOperatorsForArithmeticSequence = [operators[0], operators[1]]
                    return validOperatorsForArithmeticSequence[index]
                    }
                case "geometric: sequence":{
                    const index = constraint(0,1)
                    const validOperatorsForGeometricSequence = [operators[2], operators[3]]
                    return validOperatorsForGeometricSequence[index]
                    }
            }
        }
       function decimalToFraction(decimal) {
    // Keep whole numbers as normal numbers
    if (Number.isInteger(decimal)) {
        return String(decimal);
    }

    const string = decimal.toString();
    const decimalPlaces = string.split(".")[1].length;

    const denominator = 10 ** decimalPlaces;
    const numerator = Math.round(decimal * denominator);

    const gcd = (a, b) => {
        while (b !== 0) {
            [a, b] = [b, a % b];
        }
        return Math.abs(a);
    };

    const divisor = gcd(numerator, denominator);

    return `${numerator / divisor}/${denominator / divisor}`;
}
function simplifyFraction(numerator, denominator) {
    const gcd = (a, b) => {
        a = Math.abs(a);
        b = Math.abs(b);

        while (b !== 0) {
            [a, b] = [b, a % b];
        }

        return a;
    };

    const divisor = gcd(numerator, denominator);

    numerator /= divisor;
    denominator /= divisor;

    if (denominator === 1) {
        return String(numerator);
    }

    return `${numerator}/${denominator}`;
}
